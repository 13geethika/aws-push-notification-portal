AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Stack to provision SQS, Lambda, and IAM trigger mappings for AWS Push Notification Portal.'

Parameters:
  PlatformApplicationArn:
    Type: String
    Description: 'The ARN of your AWS SNS Platform Application (e.g. arn:aws:sns:us-east-1:123456789012:app/GCM/...)'
    Default: 'arn:aws:sns:us-east-1:758890152933:app/GCM/aws-push-notification-portal'

Resources:
  # 1. Amazon SQS Queue (Name will be auto-generated by AWS to avoid conflicts)
  PushNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 30

  # 2. IAM Role for Lambda (Name will be auto-generated by AWS to avoid conflicts)
  PushLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole'
        - 'arn:aws:iam::aws:policy/AmazonSNSFullAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'

  # 3. AWS Lambda Function (Name will be auto-generated by AWS to avoid conflicts)
  PushNotificationWorker:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: 'nodejs22.x'
      Handler: 'index.handler'
      Role: !GetAtt PushLambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          PLATFORM_APPLICATION_ARN: !Ref PlatformApplicationArn
      Code:
        ZipFile: |
          const { SNSClient, CreatePlatformEndpointCommand, PublishCommand } = require("@aws-sdk/client-sns");

          const PLATFORM_APPLICATION_ARN = process.env.PLATFORM_APPLICATION_ARN;

          // Dynamically extract the region from the SNS ARN (e.g. arn:aws:sns:us-east-1:...)
          const getSnsRegion = () => {
              if (PLATFORM_APPLICATION_ARN) {
                  const parts = PLATFORM_APPLICATION_ARN.split(":");
                  if (parts.length > 3 && parts[3]) {
                      return parts[3];
                  }
              }
              return process.env.AWS_REGION || "us-east-1";
          };

          const snsClient = new SNSClient({ region: getSnsRegion() });

          exports.handler = async (event) => {
              console.log("Processing SQS Event:", JSON.stringify(event, null, 2));

              for (const record of event.Records) {
                  try {
                      // 1. Parse JSON body from SQS
                      const { deviceToken, message } = JSON.parse(record.body);
                      console.log("Sending push payload for token:", deviceToken);

                      if (!deviceToken || !message) {
                          throw new Error("Invalid payload: Missing deviceToken or message body.");
                      }

                      // 2. Create Platform Endpoint
                      const endpointRes = await snsClient.send(
                          new CreatePlatformEndpointCommand({
                              PlatformApplicationArn: PLATFORM_APPLICATION_ARN,
                              Token: deviceToken
                          })
                      );
                      const endpointArn = endpointRes.EndpointArn;
                      console.log("SNS Endpoint ARN:", endpointArn);

                      // 3. Format Multi-platform push payloads (FCM v1 and GCM)
                      const gcmPayload = JSON.stringify({
                          notification: { title: "New Message", body: message, sound: "default" },
                          data: { title: "New Message", body: message }
                      });

                      const fcmPayload = JSON.stringify({
                          message: {
                              notification: { title: "New Message", body: message }
                          }
                      });

                      const apnsPayload = JSON.stringify({
                          aps: {
                              alert: { title: "New Message", body: message },
                              sound: "default"
                          }
                      });

                      const snsMessage = JSON.stringify({
                          default: message,
                          GCM: gcmPayload,
                          FCM: fcmPayload,
                          APNS: apnsPayload
                      });

                      // 4. Publish push notification via SNS
                      const publishRes = await snsClient.send(
                          new PublishCommand({
                              TargetArn: endpointArn,
                              Message: snsMessage,
                              MessageStructure: "json"
                          })
                      );
                      console.log("Notification published successfully. MessageId:", publishRes.MessageId);

                  } catch (error) {
                      console.error("Error processing queue record:", error);
                      throw error; // Propagate error so SQS knows the processing failed
                  }
              }
              return { status: "Done" };
          };

  # 4. SQS Queue trigger for Lambda
  SQSTriggerMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !GetAtt PushNotificationQueue.Arn
      FunctionName: !GetAtt PushNotificationWorker.Arn

Outputs:
  QueueUrl:
    Description: 'The URL of your SQS Queue. Paste this URL into your Spring Boot application.properties as aws.sqsQueueUrl.'
    Value: !Ref PushNotificationQueue
  QueueArn:
    Description: 'The ARN of your SQS Queue.'
    Value: !GetAtt PushNotificationQueue.Arn
  LambdaFunctionArn:
    Description: 'The ARN of your Lambda Worker.'
    Value: !GetAtt PushNotificationWorker.Arn
