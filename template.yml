          };
          exports.handler = async (event) => {
              const path = event.rawPath || event.path || "";
              const method = event.requestContext?.http?.method || event.httpMethod || "";
              const headers = { "Access-Control-Allow-Origin": "*", "Access-Control-Allow-Headers": "Content-Type", "Access-Control-Allow-Methods": "GET,POST,OPTIONS", "Content-Type": "application/json" };
              if (method === "OPTIONS") return { statusCode: 200, headers, body: "" };
              try {
                  if (path.endsWith("/health") && method === "GET") {
                      return { statusCode: 200, headers, body: JSON.stringify({ status: "OK" }) };
                  }
                  if (path.endsWith("/config") && method === "GET") {
                      return { statusCode: 200, headers, body: JSON.stringify(firebaseConfig) };
                  }
                  if (path.endsWith("/register") && method === "POST") {
                      const body = JSON.parse(event.body || "{}");
                      return { statusCode: 200, headers, body: JSON.stringify({ success: true, messageId: body.deviceToken }) };
                  }
