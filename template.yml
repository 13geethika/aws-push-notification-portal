AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Stack provisioning three isolated environments (DEV, PROD, DEBUG) for SQS + DLQ + Lambda + API Gateway.'

Parameters:
  # === DEV PARAMETERS ===
  DevPlatformApplicationArn:
    Type: String
    Default: 'arn:aws:sns:us-east-1:758890152933:app/GCM/aws-push-notification-portal'
  DevFirebaseApiKey:
    Type: String
    Default: 'AIzaSyASfUcN6j8s3eHIsz5N2496eU3bYaePgro'
  DevFirebaseProjectId:
    Type: String
    Default: 'pushnotifications-ccdfd'
  DevFirebaseMessagingSenderId:
    Type: String
    Default: '849698064070'
  DevFirebaseAppId:
    Type: String
    Default: '1:849698064070:web:18892abbae61d8e9e5b9c7'
  DevFirebaseVapidKey:
    Type: String
    Default: 'BDMbQi4E0idht2hBHm_teFcW9k1dzFekxzIliltvS8Fq49jEaxgE56e5H4SZpLgaVpnSpCB2uCAtrFk9RScZ2Z4'

  # === PROD PARAMETERS ===
  ProdPlatformApplicationArn:
    Type: String
    Default: 'arn:aws:sns:us-east-1:758890152933:app/GCM/aws-push-notification-portal'
  ProdFirebaseApiKey:
    Type: String
    Default: 'AIzaSyASfUcN6j8s3eHIsz5N2496eU3bYaePgro'
  ProdFirebaseProjectId:
    Type: String
    Default: 'pushnotifications-ccdfd'
  ProdFirebaseMessagingSenderId:
    Type: String
    Default: '849698064070'
  ProdFirebaseAppId:
    Type: String
    Default: '1:849698064070:web:18892abbae61d8e9e5b9c7'
  ProdFirebaseVapidKey:
    Type: String
    Default: 'BDMbQi4E0idht2hBHm_teFcW9k1dzFekxzIliltvS8Fq49jEaxgE56e5H4SZpLgaVpnSpCB2uCAtrFk9RScZ2Z4'

  # === DEBUG PARAMETERS ===
  DebugPlatformApplicationArn:
    Type: String
    Default: 'arn:aws:sns:us-east-1:758890152933:app/GCM/aws-push-notification-portal'
  DebugFirebaseApiKey:
    Type: String
    Default: 'AIzaSyASfUcN6j8s3eHIsz5N2496eU3bYaePgro'
  DebugFirebaseProjectId:
    Type: String
    Default: 'pushnotifications-ccdfd'
  DebugFirebaseMessagingSenderId:
    Type: String
    Default: '849698064070'
  DebugFirebaseAppId:
    Type: String
    Default: '1:849698064070:web:18892abbae61d8e9e5b9c7'
  DebugFirebaseVapidKey:
    Type: String
    Default: 'BDMbQi4E0idht2hBHm_teFcW9k1dzFekxzIliltvS8Fq49jEaxgE56e5H4SZpLgaVpnSpCB2uCAtrFk9RScZ2Z4'

Resources:
  # =========================================================================
  # SHARED RESOURCES
  # =========================================================================
  PushLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole'
        - 'arn:aws:iam::aws:policy/AmazonSNSFullAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonSQSFullAccess'

  PushApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: 'PushNotificationAPI'
      ProtocolType: 'HTTP'
      CorsConfiguration:
        AllowHeaders: ['*']
        AllowMethods: ['*']
        AllowOrigins: ['*']

  PushApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PushApiGateway
      StageName: '$default'
      AutoDeploy: true

  # =========================================================================
  # DEV RESOURCES
  # =========================================================================
  PushNotificationDLQDev:
    Type: AWS::SQS::Queue

  PushNotificationQueueDev:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 30
      DelaySeconds: 0
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PushNotificationDLQDev.Arn
        maxReceiveCount: 3

  PushApiLambdaDev:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: 'nodejs22.x'
      Handler: 'index.handler'
      Role: !GetAtt PushLambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref PushNotificationQueueDev
          FIREBASE_API_KEY: !Ref DevFirebaseApiKey
          FIREBASE_PROJECT_ID: !Ref DevFirebaseProjectId
          FIREBASE_MESSAGING_SENDER_ID: !Ref DevFirebaseMessagingSenderId
          FIREBASE_APP_ID: !Ref DevFirebaseAppId
          FIREBASE_VAPID_KEY: !Ref DevFirebaseVapidKey
      Code:
        ZipFile: |
          const { SQSClient, SendMessageCommand } = require("@aws-sdk/client-sqs");
          const sqsClient = new SQSClient({ region: process.env.AWS_REGION || "us-east-1" });
          const SQS_QUEUE_URL = process.env.SQS_QUEUE_URL;
          const firebaseConfig = {
              apiKey: process.env.FIREBASE_API_KEY,
              authDomain: `${process.env.FIREBASE_PROJECT_ID}.firebaseapp.com`,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: `${process.env.FIREBASE_PROJECT_ID}.firebasestorage.app`,
              messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
              appId: process.env.FIREBASE_APP_ID,
              vapidKey: process.env.FIREBASE_VAPID_KEY
          };
          exports.handler = async (event) => {
              const path = event.rawPath || event.path || "";
              const method = event.requestContext?.http?.method || event.httpMethod || "";
              const headers = { "Access-Control-Allow-Origin": "*", "Access-Control-Allow-Headers": "Content-Type", "Access-Control-Allow-Methods": "GET,POST,OPTIONS", "Content-Type": "application/json" };
              if (method === "OPTIONS") return { statusCode: 200, headers, body: "" };
              try {
                  if (path.endsWith("/health") && method === "GET") {
                      return { statusCode: 200, headers, body: JSON.stringify({ status: "OK" }) };
                  }
                  if (path.endsWith("/config") && method === "GET") {
                      return { statusCode: 200, headers, body: JSON.stringify(firebaseConfig) };
                  }
                  if (path.endsWith("/register") && method === "POST") {
                      const body = JSON.parse(event.body || "{}");
                      return { statusCode: 200, headers, body: JSON.stringify({ success: true, messageId: body.deviceToken }) };
                  }
                  if (path.endsWith("/send") && method === "POST") {
                      const body = JSON.parse(event.body || "{}");
                      const sendRes = await sqsClient.send(new SendMessageCommand({
                          QueueUrl: SQS_QUEUE_URL,
                          MessageBody: JSON.stringify({ deviceToken: body.deviceToken.trim(), message: body.message.trim() })
                      }));
                      return { statusCode: 200, headers, body: JSON.stringify({ success: true, messageId: sendRes.MessageId }) };
                  }
                  return { statusCode: 404, headers, body: JSON.stringify({ error: "Route not found" }) };
              } catch (e) {
                  return { statusCode: 500, headers, body: JSON.stringify({ success: false, error: e.message }) };
              }
          };

  PushNotificationWorkerDev:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: 'nodejs22.x'
      Handler: 'index.handler'
      Role: !GetAtt PushLambdaExecutionRole.Arn
      Timeout: 15
      Environment:
        Variables:
          PLATFORM_APPLICATION_ARN: !Ref DevPlatformApplicationArn
      Code:
        ZipFile: |
          const { SNSClient, CreatePlatformEndpointCommand, PublishCommand } = require("@aws-sdk/client-sns");
          const PLATFORM_APPLICATION_ARN = process.env.PLATFORM_APPLICATION_ARN;
          const getSnsRegion = () => {
              if (PLATFORM_APPLICATION_ARN) {
                  const parts = PLATFORM_APPLICATION_ARN.split(":");
                  if (parts.length > 3 && parts[3]) return parts[3];
              }
              return process.env.AWS_REGION || "us-east-1";
          };
          const snsClient = new SNSClient({ region: getSnsRegion() });
          exports.handler = async (event) => {
              console.log(`[BATCH START] Invocation received with ${event.Records.length} message(s).`);
              const batchItemFailures = [];

              for (const record of event.Records) {
                  try {
                      const { deviceToken, message } = JSON.parse(record.body);
                      if (!deviceToken || deviceToken.length < 50 || deviceToken.toLowerCase().includes("fail") || deviceToken.toLowerCase().includes("test") || deviceToken.toLowerCase().includes("invalid")) {
                          console.error(`[BATCH ITEM FAILED] MessageId: ${record.messageId} failed validation for token "${deviceToken}".`);
                          throw new Error(`Invalid token: "${deviceToken}"`);
                      }
                      const endpointRes = await snsClient.send(new CreatePlatformEndpointCommand({ PlatformApplicationArn: PLATFORM_APPLICATION_ARN, Token: deviceToken }));
                      const endpointArn = endpointRes.EndpointArn;
                      const gcmPayload = JSON.stringify({ notification: { title: "New Message (DEV)", body: message, sound: "default" }, data: { title: "New Message", body: message } });
                      const fcmPayload = JSON.stringify({ message: { notification: { title: "New Message (DEV)", body: message } } });
                      const snsMessage = JSON.stringify({ default: message, GCM: gcmPayload, FCM: fcmPayload });
                      await snsClient.send(new PublishCommand({ TargetArn: endpointArn, Message: snsMessage, MessageStructure: "json" }));
                      console.log(`[BATCH ITEM OK] MessageId: ${record.messageId} sent successfully.`);
                  } catch (error) {
                      console.error(`[BATCH ITEM ERROR] MessageId: ${record.messageId} error:`, error.message);
                      batchItemFailures.push({ itemIdentifier: record.messageId });
                  }
              }
              console.log(`[BATCH SUMMARY] Total: ${event.Records.length}, Succeeded: ${event.Records.length - batchItemFailures.length}, Failed: ${batchItemFailures.length}`);
              return { batchItemFailures };
          };

  SQSTriggerMappingDev:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true
      EventSourceArn: !GetAtt PushNotificationQueueDev.Arn
      FunctionName: !GetAtt PushNotificationWorkerDev.Arn

  PushApiIntegrationDev:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PushApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PushApiLambdaDev.Arn}/invocations
      PayloadFormatVersion: '2.0'

  PushApiRouteDev:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PushApiGateway
      RouteKey: 'ANY /dev/{proxy+}'
      Target: !Sub integrations/${PushApiIntegrationDev}

  PushApiLambdaPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt PushApiLambdaDev.Arn
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PushApiGateway}/*/*/dev/*'


  # =========================================================================
  # PROD RESOURCES
  # =========================================================================
  PushNotificationDLQProd:
    Type: AWS::SQS::Queue

