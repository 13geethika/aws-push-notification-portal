  PushApiIntegrationProd:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PushApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PushApiLambdaProd.Arn}/invocations
