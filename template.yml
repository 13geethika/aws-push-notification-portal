  PushApiLambdaProd:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: 'nodejs22.x'
      Handler: 'index.handler'
      Role: !GetAtt PushLambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref PushNotificationQueueProd
          FIREBASE_API_KEY: !Ref ProdFirebaseApiKey
          FIREBASE_PROJECT_ID: !Ref ProdFirebaseProjectId
          FIREBASE_MESSAGING_SENDER_ID: !Ref ProdFirebaseMessagingSenderId
          FIREBASE_APP_ID: !Ref ProdFirebaseAppId
          FIREBASE_VAPID_KEY: !Ref ProdFirebaseVapidKey
