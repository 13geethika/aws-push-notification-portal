  PushApiLambdaPermissionProd:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt PushApiLambdaProd.Arn
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PushApiGateway}/*/*/prod/*'


  # =========================================================================
  # DEBUG RESOURCES
  # =========================================================================
  PushNotificationDLQDebug:
    Type: AWS::SQS::Queue

  PushNotificationQueueDebug:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 30
      DelaySeconds: 0
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PushNotificationDLQDebug.Arn
        maxReceiveCount: 3

  PushApiLambdaDebug:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: 'nodejs22.x'
      Handler: 'index.handler'
      Role: !GetAtt PushLambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref PushNotificationQueueDebug
          FIREBASE_API_KEY: !Ref DebugFirebaseApiKey
          FIREBASE_PROJECT_ID: !Ref DebugFirebaseProjectId
          FIREBASE_MESSAGING_SENDER_ID: !Ref DebugFirebaseMessagingSenderId
          FIREBASE_APP_ID: !Ref DebugFirebaseAppId
          FIREBASE_VAPID_KEY: !Ref DebugFirebaseVapidKey
          LOG_LEVEL: 'DEBUG'
      Code:
        ZipFile: |
          const { SQSClient, SendMessageCommand } = require("@aws-sdk/client-sqs");
          const sqsClient = new SQSClient({ region: process.env.AWS_REGION || "us-east-1" });
          const SQS_QUEUE_URL = process.env.SQS_QUEUE_URL;
          const firebaseConfig = {
              apiKey: process.env.FIREBASE_API_KEY,
              authDomain: `${process.env.FIREBASE_PROJECT_ID}.firebaseapp.com`,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: `${process.env.FIREBASE_PROJECT_ID}.firebasestorage.app`,
              messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
              appId: process.env.FIREBASE_APP_ID,
              vapidKey: process.env.FIREBASE_VAPID_KEY
          };
          exports.handler = async (event) => {
              console.log("[DEBUG LOGS] Received Event Payload:", JSON.stringify(event, null, 2));
              const path = event.rawPath || event.path || "";
              const method = event.requestContext?.http?.method || event.httpMethod || "";
              const headers = { "Access-Control-Allow-Origin": "*", "Access-Control-Allow-Headers": "Content-Type", "Access-Control-Allow-Methods": "GET,POST,OPTIONS", "Content-Type": "application/json" };
              if (method === "OPTIONS") return { statusCode: 200, headers, body: "" };
              try {
                  if (path.endsWith("/health") && method === "GET") {
                      console.log("[DEBUG LOGS] Health check requested.");
                      return { statusCode: 200, headers, body: JSON.stringify({ status: "OK" }) };
                  }
                  if (path.endsWith("/config") && method === "GET") {
                      console.log("[DEBUG LOGS] Config requested. Dispatching firebase object.");
                      return { statusCode: 200, headers, body: JSON.stringify(firebaseConfig) };
                  }
                  if (path.endsWith("/register") && method === "POST") {
                      const body = JSON.parse(event.body || "{}");
                      console.log("[DEBUG LOGS] Mocking registration for token:", body.deviceToken);
                      return { statusCode: 200, headers, body: JSON.stringify({ success: true, messageId: body.deviceToken }) };
                  }
                  if (path.endsWith("/send") && method === "POST") {
                      const body = JSON.parse(event.body || "{}");
                      console.log("[DEBUG LOGS] Enqueuing send payload to SQS:", body);
                      const sendRes = await sqsClient.send(new SendMessageCommand({
                          QueueUrl: SQS_QUEUE_URL,
                          MessageBody: JSON.stringify({ deviceToken: body.deviceToken.trim(), message: body.message.trim() })
                      }));
                      console.log("[DEBUG LOGS] SQS enqueue completed. MessageId:", sendRes.MessageId);
                      return { statusCode: 200, headers, body: JSON.stringify({ success: true, messageId: sendRes.MessageId }) };
                  }
                  return { statusCode: 404, headers, body: JSON.stringify({ error: "Route not found" }) };
              } catch (e) {
                  console.error("[DEBUG LOGS] Exception caught:", e);
                  return { statusCode: 500, headers, body: JSON.stringify({ success: false, error: e.message }) };
              }
          };

  PushNotificationWorkerDebug:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: 'nodejs22.x'
      Handler: 'index.handler'
      Role: !GetAtt PushLambdaExecutionRole.Arn
      Timeout: 15
      Environment:
        Variables:
          PLATFORM_APPLICATION_ARN: !Ref DebugPlatformApplicationArn
      Code:
        ZipFile: |
          const { SNSClient, CreatePlatformEndpointCommand, PublishCommand } = require("@aws-sdk/client-sns");
          const PLATFORM_APPLICATION_ARN = process.env.PLATFORM_APPLICATION_ARN;
          const getSnsRegion = () => {
              if (PLATFORM_APPLICATION_ARN) {
                  const parts = PLATFORM_APPLICATION_ARN.split(":");
                  if (parts.length > 3 && parts[3]) return parts[3];
              }
              return process.env.AWS_REGION || "us-east-1";
          };
          const snsClient = new SNSClient({ region: getSnsRegion() });
          exports.handler = async (event) => {
              console.log(`[DEBUG LOGS] [BATCH START] Invocation received with ${event.Records.length} message(s).`);
              const batchItemFailures = [];

              for (const record of event.Records) {
                  try {
                      const { deviceToken, message } = JSON.parse(record.body);
                      if (!deviceToken || deviceToken.length < 50 || deviceToken.toLowerCase().includes("fail") || deviceToken.toLowerCase().includes("test") || deviceToken.toLowerCase().includes("invalid")) {
                          console.log(`[DEBUG LOGS] [BATCH ITEM FAILED] MessageId: ${record.messageId} failed validation!`);
                          throw new Error(`Device token validation failed: "${deviceToken}". Token is not a valid FCM device token.`);
                      }
                      console.log("[DEBUG LOGS] Mapping device token to platform ARN:", deviceToken);
                      const endpointRes = await snsClient.send(new CreatePlatformEndpointCommand({ PlatformApplicationArn: PLATFORM_APPLICATION_ARN, Token: deviceToken }));
                      const endpointArn = endpointRes.EndpointArn;
                      console.log("[DEBUG LOGS] Platform endpoint established:", endpointArn);
                      const gcmPayload = JSON.stringify({ notification: { title: "New Message (DEBUG)", body: message, sound: "default" }, data: { title: "New Message", body: message } });
                      const fcmPayload = JSON.stringify({ message: { notification: { title: "New Message (DEBUG)", body: message } } });
                      const snsMessage = JSON.stringify({ default: message, GCM: gcmPayload, FCM: fcmPayload });
                      console.log("[DEBUG LOGS] Publishing push via SNS...");
                      const result = await snsClient.send(new PublishCommand({ TargetArn: endpointArn, Message: snsMessage, MessageStructure: "json" }));
                      console.log(`[DEBUG LOGS] [BATCH ITEM OK] Notification dispatched. MessageId: ${record.messageId}, SNS MessageId: ${result.MessageId}`);
                  } catch (error) {
                      console.error(`[DEBUG LOGS] [BATCH ITEM ERROR] MessageId: ${record.messageId} failed:`, error.message);
                      batchItemFailures.push({ itemIdentifier: record.messageId });
                  }
              }
              console.log(`[DEBUG LOGS] [BATCH COMPLETE] Total: ${event.Records.length}, Succeeded: ${event.Records.length - batchItemFailures.length}, Failed: ${batchItemFailures.length}`);
              return { batchItemFailures };
          };

  SQSTriggerMappingDebug:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true
      EventSourceArn: !GetAtt PushNotificationQueueDebug.Arn
      FunctionName: !GetAtt PushNotificationWorkerDebug.Arn

  PushApiIntegrationDebug:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PushApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PushApiLambdaDebug.Arn}/invocations
      PayloadFormatVersion: '2.0'

  PushApiRouteDebug:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PushApiGateway
      RouteKey: 'ANY /debug/{proxy+}'
      Target: !Sub integrations/${PushApiIntegrationDebug}

  PushApiLambdaPermissionDebug:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt PushApiLambdaDebug.Arn
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PushApiGateway}/*/*/debug/*'

  # =========================================================================
  # CLOUDFRONT CDN & S3 STATIC HOSTING (LOW-COST / FREE-TIER OPTIMIZED)
  # =========================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-OAC"
        Description: 'Origin Access Control for secure S3 access from CloudFront'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${FrontendBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
          - Sid: AllowCloudFrontListBucket
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:ListBucket'
            Resource: !Sub 'arn:aws:s3:::${FrontendBucket}'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: 'CloudFront CDN for Push Notification Portal (React SPA + API Gateway)'
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${PushApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CacheBehaviors:
          - PathPattern: '/dev/*'
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers:
                - Accept
                - Authorization
                - Content-Type
                - Referer
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
          - PathPattern: '/prod/*'
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers:
                - Accept
                - Authorization
                - Content-Type
                - Referer
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
          - PathPattern: '/debug/*'
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
              Headers:
                - Accept
                - Authorization
                - Content-Type
                - Referer
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

Outputs:
  CloudFrontDistributionUrl:
    Description: 'CloudFront CDN URL. Access the hosted React app or point VITE_API_URL here.'
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  CloudFrontDistributionId:
    Description: 'CloudFront Distribution ID.'
    Value: !Ref CloudFrontDistribution
  FrontendS3BucketName:
    Description: 'S3 Bucket name for uploading React build files (dist).'
    Value: !Ref FrontendBucket
  ApiGatewayRootUrl:
    Description: 'The base API Gateway URL. Append /dev, /prod, or /debug to configure environment-specific VITE_API_URL.'
    Value: !Sub 'https://${PushApiGateway}.execute-api.${AWS::Region}.amazonaws.com'
  DevApiGatewayUrl:
    Description: 'Development API Gateway URL. Set this as VITE_API_URL in frontend/.env.dev'
    Value: !Sub 'https://${PushApiGateway}.execute-api.${AWS::Region}.amazonaws.com/dev'
  ProdApiGatewayUrl:
    Description: 'Production API Gateway URL. Set this as VITE_API_URL in frontend/.env.prod'
    Value: !Sub 'https://${PushApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod'
  DebugApiGatewayUrl:
    Description: 'Debug API Gateway URL. Set this as VITE_API_URL in frontend/.env.debug'
    Value: !Sub 'https://${PushApiGateway}.execute-api.${AWS::Region}.amazonaws.com/debug'
